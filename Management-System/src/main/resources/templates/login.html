<!doctype html>
<!--
  Thymeleaf template for the Login page.
  xmlns:th includes Thymeleaf attributes like th:action, th:if etc.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="login-page">
    <div class="login-card">
      <!-- Logo & Heading -->
      <div class="login-logo">
        <div class="logo-icon">🎓</div>
        <h1>Student Management</h1>
        <p>Sign in to access the dashboard</p>
      </div>

      <!-- Error Alert -->
      <!--
      th:if="${param.error}" checks if the URL has ?error (set by Spring Security on failed login)
    -->
      <div class="alert alert-danger" th:if="${param.error}">
        ⚠️ Invalid username or password. Please try again.
      </div>

      <!-- Logout Success Alert -->
      <div class="alert alert-success" th:if="${param.logout}">
        ✅ You have been logged out successfully.
      </div>

      <!-- Login Form -->
      <!--
      th:action="@{/login}" → resolves to the context-relative URL /login
      method="post" → Spring Security handles POST /login
    -->
      <form th:action="@{/login}" method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            id="username"
            type="text"
            name="username"
            placeholder="Enter your username"
            required
            autofocus
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" class="login-btn">Sign In →</button>
      </form>

      <!-- Credentials Hint (for demo purposes) -->
      <div class="login-hint">
        <span>Demo credentials</span>
        <div class="hint-creds">
          <span>admin / admin123</span>
          <span>user / user123</span>
        </div>
      </div>
    </div>
  </body>
</html>
