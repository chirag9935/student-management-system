<!doctype html>
<!--
  Student Add / Edit form template.
  This same template is reused for both adding a new student and editing an existing one.
  The controller sets "formTitle" to distinguish which mode we're in.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- th:text sets the title dynamically based on formTitle model attribute -->
    <title th:text="${formTitle} + ' — Student Management System'">
      Student Form
    </title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <!-- Shared Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="form-container">
      <div class="form-card">
        <!-- Form Header -->
        <h2 th:text="${formTitle}">Student Form</h2>
        <p class="form-subtitle">
          Fill in the student details below. Fields marked with * are required.
        </p>

        <!--
        th:action="@{/save}"    → posts to /save in the controller
        th:object="${student}"  → binds the form to the 'student' model attribute
      -->
        <form th:action="@{/save}" method="post" th:object="${student}">
          <!-- Hidden field to carry the student ID (null for new students) -->
          <input type="hidden" th:field="*{id}" />

          <div class="form-grid">
            <!-- ── Name ───────────────────────────────── -->
            <div class="form-group">
              <label for="name">Full Name *</label>
              <!--
              th:field="*{name}" binds input value to student.name
              th:classappend adds 'is-invalid' CSS class when there's a validation error
            -->
              <input
                id="name"
                type="text"
                th:field="*{name}"
                placeholder="e.g. Chirag Chaudhary"
                th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
              />
              <!--
              th:errors="*{name}" shows the validation error message for the 'name' field.
              th:if="${#fields.hasErrors('name')}" only renders if an error exists.
            -->
              <span
                class="field-error"
                th:if="${#fields.hasErrors('name')}"
                th:errors="*{name}"
                >Name error</span
              >
            </div>

            <!-- ── Email ──────────────────────────────── -->
            <div class="form-group">
              <label for="email">Email Address *</label>
              <input
                id="email"
                type="email"
                th:field="*{email}"
                placeholder="e.g. chirag@gmail.com"
                th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
              />
              <span
                class="field-error"
                th:if="${#fields.hasErrors('email')}"
                th:errors="*{email}"
                >Email error</span
              >
            </div>

            <!-- ── Course ─────────────────────────────── -->
            <div class="form-group">
              <label for="course">Course *</label>
              <input
                id="course"
                type="text"
                th:field="*{course}"
                placeholder="e.g. Spring Boot, Java Basics"
                th:classappend="${#fields.hasErrors('course')} ? 'is-invalid' : ''"
              />
              <span
                class="field-error"
                th:if="${#fields.hasErrors('course')}"
                th:errors="*{course}"
                >Course error</span
              >
            </div>

            <!-- ── Marks ──────────────────────────────── -->
            <div class="form-group">
              <label for="marks">Marks (0–100) *</label>
              <input
                id="marks"
                type="number"
                step="0.1"
                min="0"
                max="100"
                th:field="*{marks}"
                placeholder="e.g. 85.5"
                th:classappend="${#fields.hasErrors('marks')} ? 'is-invalid' : ''"
              />
              <span
                class="field-error"
                th:if="${#fields.hasErrors('marks')}"
                th:errors="*{marks}"
                >Marks error</span
              >
            </div>

            <!-- ── Phone ──────────────────────────────── -->
            <div class="form-group">
              <label for="phone">Phone Number (optional)</label>
              <input
                id="phone"
                type="tel"
                th:field="*{phone}"
                placeholder="e.g. +91-9876543210"
                th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
              />
              <span
                class="field-error"
                th:if="${#fields.hasErrors('phone')}"
                th:errors="*{phone}"
                >Phone error</span
              >
            </div>

            <!-- ── Enrolled Date ───────────────────────── -->
            <div class="form-group">
              <label for="enrolledDate">Enrollment Date (optional)</label>
              <input id="enrolledDate" type="date" th:field="*{enrolledDate}" />
            </div>
          </div>
          <!-- /form-grid -->

          <!-- Form Actions -->
          <div class="form-actions">
            <a th:href="@{/}" class="btn btn-secondary">⬅️ Cancel</a>
            <button type="submit" class="btn btn-primary">
              💾 Save Student
            </button>
          </div>
        </form>
      </div>
      <!-- /form-card -->
    </div>
    <!-- /form-container -->
  </body>
</html>
