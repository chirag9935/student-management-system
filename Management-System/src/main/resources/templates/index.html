<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>🎓 Student Management Dashboard</h1>
    <a href="/add" class="btn">➕ Add New Student</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Marks</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.course}"></td>
            <td th:text="${student.marks}"></td>
            <td>
                <a th:href="@{'/edit/' + ${student.id}}" class="btn small">✏️ Edit</a>
                <a th:href="@{'/delete/' + ${student.id}}" class="btn small danger">🗑️ Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
