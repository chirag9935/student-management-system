spring.application.name=Student Management System

# ─── Server ─────────────────────────────────────────────────────────────────
server.port=8080

# ─── H2 In-Memory Database ──────────────────────────────────────────────────
# jdbc:h2:mem:studentdb  → "mem" = in-memory (data resets when app stops)
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# "create-drop" = create tables on startup, drop on shutdown (good for demo)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ─── SQL Init ───────────────────────────────────────────────────────────────
# Always run data.sql on startup to seed sample data
spring.sql.init.mode=always
# Must defer data.sql until Hibernate has created the tables first
spring.jpa.defer-datasource-initialization=true

# ─── H2 Console (Dev only — disable in production) ──────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Thymeleaf ──────────────────────────────────────────────────────────────
# Disable caching so changes to templates are reflected without restart
spring.thymeleaf.cache=false
